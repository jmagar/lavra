name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@eb5f36cf517ffc949aca1c81e2ccbc71b5a85267
    with:
      profile: node
      implementation-ref: eb5f36cf517ffc949aca1c81e2ccbc71b5a85267

  compatibility:
    uses: dinglebear-ai/workflows/.github/workflows/fast-bun.yml@eb5f36cf517ffc949aca1c81e2ccbc71b5a85267
    with:
      bun-version: "1.3.6"
      working-directory: scripts
      install-command: bun install --frozen-lockfile
      audit-command: bun audit
      lint-command: ""
      typecheck-command: ""
      test-command: >-
        bun run convert-opencode.ts &&
        bun run convert-gemini.ts &&
        bun run convert-cortex.ts &&
        bun run test:all
      build-command: ""
      timeout-minutes: 15

  helper:
    uses: dinglebear-ai/workflows/.github/workflows/fast-go.yml@eb5f36cf517ffc949aca1c81e2ccbc71b5a85267
    with:
      go-version: "1.26.1"
      working-directory: plugins/lavra/hooks/memorysanitize
      vet-command: go vet ./...
      test-command: go test -race ./...
      timeout-minutes: 15

  installer:
    uses: dinglebear-ai/workflows/.github/workflows/install-contract.yml@eb5f36cf517ffc949aca1c81e2ccbc71b5a85267
    with:
      installer: install.sh
      contract-command: >-
        node bin/install.js --help &&
        bash -n uninstall.sh &&
        shellcheck uninstall.sh &&
        test "$(jq -r '.version' package.json)"
        = "$(jq -r '.plugins[] | select(.name == "lavra") | .version'
        .claude-plugin/marketplace.json)" &&
        ! jq -e 'has("version")'
        plugins/lavra/.claude-plugin/plugin.json >/dev/null

  gate:
    name: CI
    if: always()
    needs: [contract, compatibility, helper, installer]
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 2
    steps:
      - name: Require every fast lane
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success success"
